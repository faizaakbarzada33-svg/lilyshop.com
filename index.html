<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LILY Shop | لیلی شاپ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#fff;color:#171717}
header{background:#111;color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-size:27px;letter-spacing:3px;font-weight:bold}.logo small{display:block;font-size:11px;letter-spacing:1px;text-align:center;color:#ddd}
.cart{background:#fff;color:#111;border:0;border-radius:30px;padding:10px 16px;cursor:pointer;font-weight:bold}
.hero{padding:75px 7%;text-align:center;background:linear-gradient(135deg,#fff,#f5f5f5)}
.hero h1{font-size:45px;margin:0 0 12px;letter-spacing:5px}.hero p{color:#555;font-size:16px}.hero button,.checkout button{background:#111;color:white;border:0;padding:13px 25px;border-radius:25px;cursor:pointer}
section{padding:45px 6%;max-width:1200px;margin:auto}h2{text-align:center;margin-bottom:30px}
.categories{text-align:center;margin-bottom:30px}.categories button{margin:5px;padding:9px 18px;border:1px solid #222;background:white;border-radius:20px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.card{border:1px solid #eee;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 5px 18px #0000000b}
.pic{height:210px;background:#f3f3f3;display:flex;align-items:center;justify-content:center;font-size:55px}.info{padding:17px}.info h3{margin:0 0 8px}.price{font-weight:bold;font-size:18px}.add{width:100%;margin-top:13px;padding:11px;border:0;border-radius:12px;background:#111;color:#fff;cursor:pointer}
#cartPanel{position:fixed;right:-420px;top:0;width:390px;max-width:95%;height:100%;background:#fff;z-index:30;box-shadow:-5px 0 25px #0003;padding:25px;transition:.3s;overflow:auto}
#cartPanel.open{right:0}.close{float:left;border:0;background:none;font-size:25px;cursor:pointer}
.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}.total{font-size:20px;font-weight:bold;margin:20px 0}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:7px 0 12px;font-family:inherit}
.checkout{border-top:1px solid #eee;margin-top:20px;padding-top:15px}
footer{text-align:center;background:#111;color:#fff;padding:30px;margin-top:40px}
@media(max-width:600px){.hero h1{font-size:32px}#cartPanel{width:100%}}
</style>
</head>
<body>
<header><div class="logo">LILY SHOP<small>BEAUTY & COSMETICS</small></div><button class="cart" onclick="openCart()">🛍️ سبد خرید (<span id="count">0</span>)</button></header>

<div class="hero">
<h1>LILY SHOP</h1>
<p>لوازم آرایشی، زیبایی و اکسسوری با انتخابی شیک و ترند</p>
<button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">مشاهده محصولات</button>
</div>

<section id="products">
<h2>محصولات LILY Shop</h2>
<div class="categories">
<button onclick="filter('همه')">همه</button><button onclick="filter('لب')">لب</button><button onclick="filter('آرایش')">آرایش</button><button onclick="filter('هدیه')">باکس هدیه</button>
</div>
<div class="grid" id="grid"></div>
</section>

<div id="cartPanel">
<button class="close" onclick="closeCart()">×</button>
<h2>سبد خرید</h2><div id="cartItems"></div><div class="total">مجموع: <span id="total">۰</span> ؋</div>
<div class="checkout">
<h3>ثبت سفارش</h3>
<input id="name" placeholder="نام و نام خانوادگی">
<input id="phone" placeholder="شماره تماس">
<textarea id="address" rows="3" placeholder="آدرس دقیق"></textarea>
<button onclick="submitOrder()">ثبت سفارش</button>
<p id="message" style="font-size:13px;color:#555"></p>
</div></div>

<footer>© 2026 LILY Shop — تمامی حقوق محفوظ است</footer>

<script>
const products=[
{id:1,name:"لیپ‌گلاس Road",price:80,cat:"لب",icon:"💋"},
{id:2,name:"رژلب KIKO",price:140,cat:"لب",icon:"💄"},
{id:3,name:"لیپ‌گلاس Gisu",price:150,cat:"لب",icon:"💋"},
{id:4,name:"لیپ‌گلاس Elf",price:140,cat:"لب",icon:"💄"},
{id:5,name:"هایلایتر Galaxy",price:90,cat:"آرایش",icon:"✨"},
{id:6,name:"پالت هایلایتر",price:180,cat:"آرایش",icon:"🌟"},
{id:7,name:"پالت سایه چشم",price:180,cat:"آرایش",icon:"🎨"},
{id:8,name:"باکس هدیه Fashion",price:400,cat:"هدیه",icon:"🎁"},
{id:9,name:"Vaseline Lip Balm",price:90,cat:"لب",icon:"🌸"},
{id:10,name:"خط لب",price:30,cat:"لب",icon:"🖊️"}
];
let cart=[];
const fa=n=>n.toLocaleString('fa-AF');
function render(list=products){document.getElementById('grid').innerHTML=list.map(p=>`<div class="card"><div class="pic">${p.icon}</div><div class="info"><h3>${p.name}</h3><div class="price">${fa(p.price)} ؋</div><button class="add" onclick="add(${p.id})">افزودن به سبد خرید</button></div></div>`).join('')}
function filter(c){render(c==='همه'?products:products.filter(p=>p.cat===c))}
function add(id){cart.push(products.find(p=>p.id===id));update();openCart()}
function update(){document.getElementById('count').textContent=fa(cart.length);document.getElementById('cartItems').innerHTML=cart.length?cart.map((p,i)=>`<div class="item"><span>${p.name}</span><b>${fa(p.price)} ؋ <button onclick="removeItem(${i})" style="border:0;background:none;cursor:pointer">×</button></b></div>`).join(''):'<p>سبد خرید خالی است.</p>';document.getElementById('total').textContent=fa(cart.reduce((s,p)=>s+p.price,0))}
function removeItem(i){cart.splice(i,1);update()}
function openCart(){document.getElementById('cartPanel').classList.add('open')}
function closeCart(){document.getElementById('cartPanel').classList.remove('open')}
function submitOrder(){
 if(!cart.length){document.getElementById('message').textContent='لطفاً حداقل یک محصول انتخاب کنید.';return}
 const n=document.getElementById('name').value.trim(),ph=document.getElementById('phone').value.trim(),a=document.getElementById('address').value.trim();
 if(!n||!ph||!a){document.getElementById('message').textContent='لطفاً نام، شماره تماس و آدرس را کامل کنید.';return}
 const items=cart.map(p=>p.name).join('، ');
 document.getElementById('message').textContent=`سفارش شما ثبت شد: ${items} — مجموع ${fa(cart.reduce((s,p)=>s+p.price,0))} ؋. برای اتصال سفارش‌ها به واتساپ یا پنل مدیریت، شماره/روش دریافت سفارش باید در سایت تنظیم شود.`;
}
render();update();
</script>
</body></html>
